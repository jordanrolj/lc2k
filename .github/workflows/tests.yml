name: Week 1 correctness
on: [push, pull_request]
jobs:
  isa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test.py --suite isa
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            _deps
            build/llvm
          key: llvm20-ubuntu24-${{ hashFiles('configs/toolchain.json', 'backend/**') }}
          restore-keys: llvm20-ubuntu24-
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - run: bash scripts/build.sh
      - run: python3 scripts/doctor.py
      - run: python3 scripts/test.py --suite full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-logs
          path: build/logs
